# v ile başlayan bir etiket (ör. v0.1.0) itildiğinde paketi nuget.org'a yayınlar.
# Gerekli secret: NUGET_API_KEY (nuget.org > API Keys, yalnızca BozForge.* için Push yetkisi).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Sürümü etiketten al
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet test BozForge.Bogus.Turkiye.slnx -c Release
      - run: dotnet pack src/BozForge.Bogus.Turkiye -c Release -o artifacts -p:Version=$VERSION

      - name: nuget.org'a gönder
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
